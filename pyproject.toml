[project]
name = "free-transcribe"
version = "0.1.0"
description = "Accurate local transcription with Qwen, Parakeet, and pyannote diarization."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "mlx-qwen3-asr>=0.3.5,<0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "rich",
    "mcp>=1.29,<2",
    "httpx[socks]>=0.28,<1",
]

[project.optional-dependencies]
parakeet = [
    "mlx-audio>=0.4.6,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
diarization = [
    "pyannote.audio>=4.0,<5",
]
all = [
    "mlx-audio>=0.4.6,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pyannote.audio>=4.0,<5",
]

[project.urls]
Repository = "https://github.com/vgmakeev/free-transcribe"
Issues = "https://github.com/vgmakeev/free-transcribe/issues"

[project.scripts]
transcribe = "whisper_transcribe.cli:main"
free-transcribe = "whisper_transcribe.agent_cli:main"
transcribe-mcp = "whisper_transcribe.server:main"
free-transcribe-mcp = "whisper_transcribe.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_transcribe"]
