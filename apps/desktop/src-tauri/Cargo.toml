[package]
name = "free-transcribe-desktop"
version = "0.2.0"
description = "Tiny local UI for Free Transcribe"
edition = "2024"
license = "MIT"
repository = "https://github.com/vgmakeev/free-transcribe"

[lib]
name = "free_transcribe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
